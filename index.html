  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;

    margin-bottom:10px;

  .eyes-slot{

  .eyes-slot img{
    width:100%;

    object-fit:cover;

    display:block;

.lettering{
    display:block;
    margin:6px auto 14px;

  .benfeitoria-label{
    text-align:center;

    letter-spacing:0.08em;

    margin:0 0 24px;

  .sub{
    color:var(--muted);
    font-size:14px;
    margin-bottom:28px;
  }
  .footer-ig{
    display:flex;
    justify-content:center;

  .footer-ig a{

  .qr-wrap{
    background:var(--paper);

    display:flex;

    margin-bottom:22px;
  }
  #qrcode{ line-height:0; }
  #qrcode img{ display:block; image-rendering: pixelated; }
  .field-label{
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:8px;
  }
  .copy-row{
    display:flex;
    gap:8px;
    align-items:stretch;

  .code-box{
    flex:1;
    min-width:0;
    border:1px solid var(--line);
    border-radius:12px;

</head>
<body>

  <main class="card">
    <div class="eyebrow">Chave Pix</div>
      <div class="eyes-slot"><img src="data:image/png;base64,[...mesmo base64 dos olhos...]" alt="Close dos olhos com maquiagem, imagem de identidade visual de A Persona e a Cabeça"></div>
    <img class="lettering" src="data:image/png;base64,[...mesmo base64 da logo...]" alt="A Persona e a Cabeça">
    <p class="benfeitoria-label">Nosso chapéu - benfeitoria</p>
    <p class="sub">Aponte a câmera para o QR Code ou use o Pix Copia e Cola. Valor em aberto — escolha um valor para colaborar com A Persona e A Cabeça no seu aplicativo bancário.</p>

    <div class="qr-wrap">
      <div id="qrcode" aria-label="QR Code para pagamento via Pix"></div>
    </div>

    <div class="field-label">Pix copia e cola</div>
    <div class="copy-row">
      <div class="code-box" id="pix-code">carregando…</div>
      <button id="copy-btn" type="button">Copiar</button>
    </div>

    <div class="meta">
      <span>Beneficiário<br><strong>A Persona e A Cabeça</strong></span>
      <span style="text-align:right;">Chave<br><strong>apersonaeacabeca@gmail.com</strong></span>
    </div>

    <div class="footer-ig">
      <a href="https://www.instagram.com/apersonaeacabeca/" target="_blank" rel="noopener noreferrer" aria-label="A Persona e a Cabeça no Instagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/>
          <circle cx="12" cy="12" r="4.4"/>
          <circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
    </div>
  </main>

<script>
(function(){
  // ---- Montagem do payload Pix (BR Code / EMV) — chave estática, sem valor fixo, sem expiração ----
  function tlv(id, value){
    var len = String(value.length).padStart(2, '0');
    return id + len + value;
  }

  function crc16(payload){
    var polynomial = 0x1021;
    var result = 0xFFFF;
    for (var i = 0; i < payload.length; i++){
      result ^= (payload.charCodeAt(i) << 8);
      for (var j = 0; j < 8; j++){
        if ((result & 0x8000) !== 0){
          result = ((result << 1) ^ polynomial) & 0xFFFF;
        } else {
          result = (result << 1) & 0xFFFF;
        }
      }
    }
    return result.toString(16).toUpperCase().padStart(4, '0');
  }

  function buildPixPayload(opts){
    var gui = tlv('00', 'br.gov.bcb.pix');
    var chave = tlv('01', opts.chave);
    var merchantAccountInfo = tlv('26', gui + chave);

    var payload =
      tlv('00', '01') +                     // Payload Format Indicator
      tlv('01', '11') +                     // Point of Initiation Method: 11 = estático/reutilizável
      merchantAccountInfo +                 // Informações da conta Pix
      tlv('52', '0000') +                   // Merchant Category Code
      tlv('53', '986') +                    // Moeda: BRL
      tlv('58', 'BR') +                     // País
      tlv('59', opts.nome.substring(0,25)) + // Nome do beneficiário
      tlv('60', opts.cidade.substring(0,15)) + // Cidade
      tlv('62', tlv('05', '***'));          // Additional Data Field (txid genérico p/ chave estática)

    payload += '6304'; // ID + tamanho fixo do CRC
    var crc = crc16(payload);
    return payload + crc;
  }

  var pixPayload = buildPixPayload({
    chave: 'apersonaeacabeca@gmail.com',
    nome: 'A Persona e A Cabeca',
    cidade: 'RIO DE JANEIRO'
  });

  document.getElementById('pix-code').textContent = pixPayload;

  new QRCode(document.getElementById('qrcode'), {
    text: pixPayload,
    width: 220,
    height: 220,
    colorDark: '#151320',
    colorLight: '#F4F1E9',
    correctLevel: QRCode.CorrectLevel.M
  });

  var btn = document.getElementById('copy-btn');
  btn.addEventListener('click', function(){
    navigator.clipboard.writeText(pixPayload).then(function(){
      btn.textContent = 'Copiado';
      btn.classList.add('copied');
      setTimeout(function(){
        btn.textContent = 'Copiar';
        btn.classList.remove('copied');
      }, 1800);
    });
  });
})();
</script>
</body>
